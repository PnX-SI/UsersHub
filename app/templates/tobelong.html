<!DOCTYPE html>
<html>
  {% include "librairies.html" %}
  <body>
    {% include "head-appli.html" %}

    <div class="container card" style="margin-top: 15px;">
      <div class="row forms">
        <h2>{{ info }}</h2>
        </br></br>
      </div>

      <div
        id="membership-manager"
        class="row forms"
        data-membership-mode="true"
        data-ajax-url="{{ data_ajax_url }}"
      >
        <div class="col-xs-11 col-sm-11 col-md-5 col-lg-5">
          <h5>{{ available_title }}</h5>
          <table
            id="{{ available_table_id|default('user') }}"
            class="table table-bordered table-sm"
            data-membership-panel="available"
            data-membership-columns='{{ table_columns|tojson }}'
          >
            <thead>
              <tr>
                <th scope="col">#</th>
                {% for name in fLine %}
                  <th scope="col">{{ name }}</th>
                {% endfor %}
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>

        <div class="col-xs-2 col-sm-2 col-md-2 col-lg-2 text-center">
          <p><br /><br /><br /></p>
          <button onclick="add()" type="button" class="btn btn-light" title="Ajouter">
            <i class="fa fa-arrow-circle-o-right font-big" aria-hidden="true"></i>
          </button>
          <p></p>
          <button onclick="del()" type="button" class="btn btn-light" title="Retirer">
            <i class="fa fa-arrow-circle-o-left font-big" aria-hidden="true"></i>
          </button>
        </div>

        <div class="col-xs-11 col-sm-11 col-md-5 col-lg-5">
          <h5>{{ selected_title }}</h5>
          <table
            id="{{ selected_table_id|default('adding_table') }}"
            class="table table-bordered table-sm"
            data-membership-panel="selected"
            data-membership-columns='{{ table_columns|tojson }}'
          >
            <thead>
              <tr>
                <th scope="col">#</th>
                {% for name in fLine %}
                  <th scope="col">{{ name }}</th>
                {% endfor %}
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>

        <button onclick="update()" id="update" class="btn btn-success btn-block">Enregistrer</button>
      </div>
    </div>
  </body>
</html>
